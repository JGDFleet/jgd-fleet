function recurrence(a){return a.frequency==='Semanal'?'Cada '+(weekdays[a.weekday]||'día sin configurar'):a.frequency==='Quincenal'?'Días '+(a.monthDays||[]).join(' y '):'Día '+(a.dueDay||22)}

function generateInto(d){let changed=false,horizon=datePlus(today(),30);const keys=new Set(d.periods.map(p=>p.agreementId+'|'+p.dueDate));for(const a of d.agreements){if(a.recurrenceVersion&&!a.cancelled){let start=a.autoFrom||a.effectiveDate||today(),end=a.endDate&&a.endDate<horizon?a.endDate:horizon;if(start<datePlus(today(),-3650))start=datePlus(today(),-3650);let lastDue='';for(const p of d.periods)if(p.agreementId===a.id&&p.dueDate>lastDue)lastDue=p.dueDate;if(lastDue){let fromLast=datePlus(lastDue,1);if(fromLast>start)start=fromLast;if(start>end)continue}let prev=datePlus(start,-1);for(let dt=start;dt<=end;dt=datePlus(dt,1)){if(!isDue(a,dt))continue;let k=a.id+'|'+dt;if(!keys.has(k)){d.periods.push({id:uid(),agreementId:a.id,driverId:a.driverId,vehicleId:a.vehicleId,startDate:datePlus(prev,1),endDate:dt,dueDate:dt,expected:+a.amount,auto:true});keys.add(k);changed=true}prev=dt}}
 for(const p of d.periods.filter(p=>p.agreementId===a.id&&!p.cancelled&&(a.cancelled||(a.endDate&&p.dueDate>a.endDate))))if(!d.payments.some(x=>!x.voided&&x.periodId===p.id)){p.cancelled=true;changed=true}}

return `<tr class="${d.archived||d.deleted?'voided':''}"><td>${esc(vehicleName(d.vehicleId))}</td><td>${esc(d.type)}</td><td>${esc(d.issuer)}<br>${esc(d.number)}</td><td>${esc(d.expiry)}</td><td>${badge(d.deleted?'Eliminado':d.archived?'Histórico':n<0?'Vencido':n===0?'Vence hoy':n<=30?'En '+n+' días':'Vigente',d.deleted?'red':d.archived?'':n<0?'red':n<=30?'amber':'green')}</td><td>${money(d.cost)}</td><td>${d.deleted?btn('Restaurar',`restoreRecord('documents','${d.id}')`):d.archived?btn('Eliminar',`deleteRecord('documents','${d.id}')`):btn('Editar',`documentForm('${d.id}')`)+btn('Renovar',`documentForm('${d.id}',true)`)+btn('Eliminar',`deleteRecord('documents','${d.id}')`)}</td></tr>`});return `<div class="toolbar">${btn('+ Nueva alerta planificada','planForm()','')}${btn('Registrar servicio','maintForm()','')}${btn('+ Agregar documento','documentForm()','')}</div><div class="card"><h2>⏰ Avisos automáticos</h2><p class="muted">Todo lo que requiere atención ahora o pronto: cobros, préstamo, servicios, documentos y alertas planificadas. Aviso por defecto: cobros y préstamo 7 días; documentos y servicios 30 días o 500 km; planificadas según los días que definas.</p>${alertsHTML(collectAlerts())}</div><div class="card"><h2>🗓️ Alertas planificadas</h2><p class="muted">Solo condicionan avisos a futuro. El costo estimado es opcional y no entra en ningún registro; los montos reales se imputan desde Gastos.</p>${voidBtn('plans','anuladas/eliminadas',db.plans)}${table(['Tipo','Vehículo / chofer','Vencimiento','Aviso desde','Estado','Costo estimado','Nota','Acciones'],planRows)}</div><div class="card"><h2>📄 Documentos · seguro, marbete e inspección</h2><p class="muted">Vencimientos por vehículo. El costo del documento es informativo; el gasto real se registra en Gastos.</p>${voidBtn('documents','históricos/eliminados',db.documents)}${table(['Vehículo','Documento','Emisor / número','Vencimiento','Estado','Costo','Acciones'],docRows)}</div><div class="card"><h2>🔧 Servicios realizados y próximos</h2><p class="muted">Cada servicio registrado crea el gasto real en Gastos y programa el próximo aviso por fecha o kilometraje.</p>${voidBtn('maintenance','anuladas/eliminadas',db.maintenance)}${table(['Fecha','Vehículo','Servicio / descripción','Km / proveedor','Próximo','Costo','Acciones'],maintRows)}</div>`}
function maintForm(vid='',type=''){if(!db.vehicles.length)return alert('Agrega un vehículo.');let v=byId(db.vehicles,vid)||db.vehicles[0];form('Registrar mantenimiento',`event.preventDefault();saveMaint()`,select('vehicleId','Vehículo',db.vehicles.map(v=>[v.id,vehicleName(v.id)]),v.id,`onchange="$('mileage').value=byId(db.vehicles,this.value).mileage"`)+select('type','Servicio',maintenanceTypes.map(t=>[t,t]),type||maintenanceTypes[0])+field('date','Fecha realizada',today(),'date')+field('mileage','Kilometraje',v.mileage,'number',true,'min="0" max="9999999" step="1"')+field('provider','Taller / proveedor','','text',false)+field('nextDate','Próxima fecha (opcional)','','date',false)+field('nextMileage','Próximo kilometraje (opcional)','','number',false,'min="0" max="9999999" step="1"')+field('cost','Costo',0,'number',true,'min="0" max="1000000000" step=".01"')+field('note','Descripción','','text',false),'<p class="muted">Los avisos se activan hasta 30 días antes de la fecha o 500 km antes del kilometraje programado. Para aceite y filtros se muestra además una advertencia si se registra otro servicio antes de cumplir 45 días; puedes continuar si corresponde. El costo crea un gasto operativo vinculado.</p>')}
function saveMaint(){attempt(()=>{let x={id:uid(),vehicleId:$('vehicleId').value,type:$('type').value,date:dateVal('date'),mileage:num('mileage',0,9999999,true),provider:text('provider',100,false),nextDate:dateVal('nextDate',true),nextMileage:$('nextMileage').value?num('nextMileage',0,9999999,true):0,cost:num('cost'),note:text('note',250,false)};if(x.date>today())throw Error('La fecha realizada no puede ser futura.');if(x.nextDate&&x.nextDate<x.date)throw Error('La próxima fecha no puede ser anterior al servicio.');if(x.nextMileage&&x.nextMileage<=x.mileage)throw Error('El próximo kilometraje debe superar el registrado.');let duplicate=live(db.maintenance).find(m=>m.vehicleId===x.vehicleId&&m.date===x.date&&m.type===x.type&&Number(m.mileage)===x.mileage&&String(m.provider||'').trim().toLowerCase()===x.provider.trim().toLowerCase()&&round(m.cost)===round(x.cost));if(duplicate&&!confirm('Posible mantenimiento duplicado: mismo vehículo, fecha, servicio, kilometraje, proveedor e importe. ¿Deseas registrarlo de todos modos?'))return;let warnings=[];for(const part of serviceParts(x.type)){const previous=live(db.maintenance).filter(m=>m.vehicleId===x.vehicleId&&m.date<=x.date&&serviceParts(m.type).includes(part)).sort((a,b)=>b.date.localeCompare(a.date))[0];if(previous&&diff(x.date,previous.date)<45)warnings.push(`${part}: último servicio ${previous.date}; han transcurrido ${diff(x.date,previous.date)} días (mínimo recomendado 45).`)}if(serviceParts(x.type).length&&x.nextDate&&diff(x.nextDate,x.date)<45)warnings.push('La próxima fecha está a menos de 45 días del servicio.');if(warnings.length&&!confirm(warnings.join('\n')+'\n\n¿Deseas continuar de todos modos?'))return;commit('Mantenimiento registrado',d=>{let v=byId(d.vehicles,x.vehicleId);x.mileageBefore=v.mileage;x.mileageAfter=Math.max(+v.mileage,x.mileage);v.mileage=x.mileageAfter;d.maintenance.push(x);if(x.cost)d.expenses.push({id:uid(),vehicleId:x.vehicleId,date:x.date,category:EXPENSE_CATEGORIES.includes(x.type)?x.type:x.type==='Mecánica general'?'Mecánica':'Mantenimiento',type:'Operativo',amount:x.cost,note:x.type+' · '+x.note,maintenanceId:x.id})})})}

/* Documentos: formulario y renovación. La tabla se muestra dentro de Planificación. */
function documentForm(id='',renew=false){if(!db.vehicles.length)return alert('Agrega un vehículo.');let x=byId(db.documents,id)||{vehicleId:db.vehicles[0].id,type:'Seguro',number:'',issuer:'',issueDate:'',expiry:'',cost:0};form(renew?'Renovar documento':'Documento',`event.preventDefault();saveDocument('${id}',${renew})`,select('vehicleId','Vehículo',db.vehicles.map(v=>[v.id,vehicleName(v.id)]),x.vehicleId)+select('type','Tipo',['Seguro','Marbete','Inspección','Otro'].map(x=>[x,x]),x.type)+field('number','Número / póliza',x.number,'text',false)+field('issuer','Emisor / aseguradora',x.issuer,'text',false)+field('issueDate','Emisión',renew?today():x.issueDate,'date',false)+field('expiry','Vencimiento',renew?'':x.expiry,'date')+field('cost','Costo informativo',x.cost,'number',true,'min="0" max="1000000000" step=".01"'),'<p class="muted">Renovar conserva el documento anterior. El costo no crea otro gasto automáticamente.</p>')}
function saveDocument(id,renew){attempt(()=>{let x={vehicleId:$('vehicleId').value,type:$('type').value,number:text('number',60,false),issuer:text('issuer',100,false),issueDate:dateVal('issueDate',true),expiry:dateVal('expiry'),cost:num('cost')};if(x.issueDate&&x.expiry<x.issueDate)throw Error('Vencimiento anterior a emisión.');if(renew&&x.expiry<=byId(db.documents,id).expiry&&!confirm('La nueva fecha no supera el vencimiento anterior. ¿Continuar?'))return;commit(renew?'Documento renovado':'Documento guardado',d=>{if(id&&!renew)Object.assign(byId(d.documents,id),x);else{if(renew)byId(d.documents,id).archived=true;d.documents.push({id:uid(),...x,renewedFrom:renew?id:undefined})}})})}
/* Préstamo */
function monthDue(ym){let[y,m]=ym.split('-').map(Number),last=new Date(Date.UTC(y,m,0)).getUTCDate();return ym+'-'+String(Math.min(+db.loan.dueDay,last)).padStart(2,'0')}
function shiftMonth(ym,n){let[y,m]=ym.split('-').map(Number);return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7)}
function loanAllocation(){let map={};for(const p of live(db.loan.paid)){let ym=p.appliedMonth||p.date.slice(0,7);map[ym]=round((map[ym]||0)+p.amount)}return map}
function loanDue(){let L=db.loan;if(!(L.balance>0&&L.monthly>0))return null;let map=loanAllocation(),ym=L.trackFrom||today().slice(0,7),current=today().slice(0,7);if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(ym))ym=current;for(let i=0;i<1200;i++,ym=shiftMonth(ym,1)){let remainder=Math.max(0,round(L.monthly-(map[ym]||0)));if(remainder>.005)return{date:monthDue(ym),month:ym,remaining:remainder,days:days(monthDue(ym))}}return null}
function loanView(){let L=db.loan,nd=loanDue(),legacy=live(L.paid).filter(p=>!p.appliedMonth).length;return `<div class="toolbar">${btn('Configurar préstamo','loanSettings()','')}${btn('+ Registrar cuota','loanPaymentForm()','')}${btn('Proyección','loanSchedule()')}${voidBtn('loan','anuladas',db.loan.paid)}</div><div class="notice">Modelo nominal anual / 12 sin cargos. Valida el desglose con el banco. Solo el capital reduce el saldo.</div>${legacy?`<p class="notice">${legacy} pagos anteriores no tienen cuota aplicada: provisionalmente se usa su mes de pago. Puedes corregirlo con «Asignar cuota».</p>`:''}<div class="grid">${metric('Monto original',money(L.total))}${metric('Cuota mensual',money(L.monthly))}${metric('Capital pendiente',money(L.balance))}${metric('Próximo vencimiento',nd?esc(nd.date):'—',nd?'Pendiente '+money(nd.remaining):'')}${metric('Tasa anual',esc(L.annualRate)+' %')}${metric('Pagado registrado',money(sum(live(L.paid))))}</div>`+table(['Fecha','Cuota aplicada','Referencia','Pago','Interés / cargos','Capital','Saldo posterior','Acciones'],L.paid.filter(p=>!p.voided||showVoided.loan).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr class="${p.voided?'voided':''}"><td>${esc(p.date)}</td><td>${esc(p.appliedMonth||p.date.slice(0,7)+' (estimado)')}</td><td>${esc(p.reference)}</td><td>${money(p.amount)} ${p.voided?badge('Anulado','red'):''}</td><td>${p.interest==null?'Sin desglose':money(p.interest)}<br>${p.fees==null?'—':money(p.fees)}</td><td>${p.capital==null?'Sin desglose':money(p.capital)}</td><td>${p.balanceAfter==null?'—':money(p.balanceAfter)}</td><td>${p.voided?esc(p.voidReason):btn('Asignar cuota',`loanAllocateForm('${p.id}')`)+btn('Anular',`voidRecord('loan','${p.id}')`)}</td></tr>`))+`<div class="card"><h2>Historial del reparto por vehículo</h2><p class="muted">Cada cuota nueva conserva el reparto calculado con los precios de compra vigentes al registrarla. Los pagos anteriores se muestran como estimaciones con los precios actuales. Los pagos anulados permanecen visibles, pero no cuentan en los totales vigentes.</p>${loanDistributionHistory()}</div>`}
function loanSettings(){let L=db.loan;form('Configurar préstamo',`event.preventDefault();saveLoanSettings()`,field('total','Monto original',L.total,'number',true,'min="0" max="1000000000" step=".01"')+field('annualRate','Tasa nominal anual (%)',L.annualRate,'number',true,'min="0" max="100" step=".0001"')+field('term','Cantidad de cuotas',L.term||'','number',false,'min="1" max="600" step="1"')+field('monthly','Cuota mensual',L.monthly,'number',true,'min="0" max="1000000000" step=".01"')+field('dueDay','Día de vencimiento',L.dueDay,'number',true,'min="1" max="31" step="1"')+field('balance','Capital pendiente',L.balance,'number',true,'min="0" max="1000000000" step=".01"')+field('trackFrom','Controlar cuotas desde',L.trackFrom||today().slice(0,7),'month'),`<div class="toolbar">${btn('Estimar cuota','calculateLoan()')}</div><p class="muted">«Controlar desde» define el primer mes que debe revisarse por impago. Cambiar saldo o cuota modifica las estimaciones; no altera comprobantes históricos.</p>`)}
function calculateLoan(){attempt(()=>{let p=num('total',.01),r=num('annualRate',0,100)/100/12,n=num('term',1,600,true);$('monthly').value=round(r?p*r/(1-Math.pow(1+r,-n)):p/n)})}
function saveLoanSettings(){attempt(()=>{let L={total:num('total'),annualRate:Number($('annualRate').value),term:$('term').value?num('term',1,600,true):0,monthly:num('monthly'),dueDay:num('dueDay',1,31,true),balance:num('balance'),trackFrom:$('trackFrom').value};if(!Number.isFinite(L.annualRate)||L.annualRate<0||L.annualRate>100)throw Error('Tasa inválida.');if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(L.trackFrom))throw Error('Mes inicial inválido.');if(L.total>0&&L.balance>L.total)throw Error('El saldo supera el monto original.');if(db.loan.paid.length&&L.balance!==db.loan.balance&&!confirm('Cambiarás manualmente el capital pendiente. Quedará registrado en actividad. ¿Continuar?'))return;commit('Préstamo configurado; saldo '+money(L.balance),d=>Object.assign(d.loan,L))})}
function loanPaymentForm(){if(db.loan.balance<=0)return alert('Configura el saldo pendiente.');let nd=loanDue();form('Registrar cuota pagada',`event.preventDefault();saveLoanPayment()`,field('date','Fecha de recepción',today(),'date')+field('appliedMonth','Mes de la cuota',nd?.month||today().slice(0,7),'month')+field('amount','Total recibido',nd?Math.min(nd.remaining,db.loan.monthly):db.loan.monthly,'number',true,'min=".01" max="1000000000" step=".01" oninput="previewLoan()"')+field('interest','Intereses',round(db.loan.balance*db.loan.annualRate/100/12),'number',true,'min="0" max="1000000000" step=".01" oninput="previewLoan()"')+field('fees','Seguros / cargos',0,'number',true,'min="0" max="1000000000" step=".01" oninput="previewLoan()"')+field('reference','Referencia','','text',false),'<p id="loanPreview" class="notice"></p><p class="muted">Sustituye intereses sugeridos por los del comprobante. Un pago parcial no da por completada la cuota.</p>');previewLoan()}
function previewLoan(){if(!($('amount').value&&$('interest').value&&$('fees').value)){$('loanPreview').textContent='Completa el pago, los intereses y los cargos para ver el abono a capital.';return}let c=round(+$('amount').value-+$('interest').value-+$('fees').value);$('loanPreview').textContent='Abono a capital: '+money(c)+' · Saldo posterior: '+money(db.loan.balance-c)}
function saveLoanPayment(){attempt(()=>{let amount=num('amount',.01),interest=num('interest'),fees=num('fees'),capital=round(amount-interest-fees),date=dateVal('date'),appliedMonth=$('appliedMonth').value,reference=text('reference',40,false);if(date>today()||!/^\d{4}-(0[1-9]|1[0-2])$/.test(appliedMonth))throw Error('Revisa fecha y cuota aplicada.');if(capital<0||capital>db.loan.balance)throw Error('Desglose inválido: revisa el abono a capital.');let duplicate=db.loan.paid.find(z=>z.appliedMonth===appliedMonth&&z.date===date&&round(z.amount)===round(amount)&&(!reference||String(z.reference||'').trim().toLowerCase()===reference.trim().toLowerCase()));if(duplicate&&!confirm('Posible cuota duplicada para el mismo mes, fecha e importe. ¿Deseas registrarla de todos modos?'))return;commit('Cuota pagada · '+appliedMonth,d=>{let before=d.loan.balance;d.loan.paid.push({id:uid(),date,appliedMonth,amount,interest,fees,capital,reference,balanceBefore:before,balanceAfter:round(before-capital),vehicleDistribution:currentLoanDistribution(amount)});d.loan.balance=round(before-capital)})})}
function loanAllocateForm(id){let p=byId(db.loan.paid,id);form('Asignar pago a una cuota',`event.preventDefault();saveLoanAllocation('${id}')`,field('appliedMonth','Mes de la cuota',p.appliedMonth||p.date.slice(0,7),'month'),'<p class="muted">No crea otro pago ni modifica el capital.</p>')}
function saveLoanAllocation(id){let ym=$('appliedMonth').value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(ym))return alert('Mes inválido.');commit('Cuota aplicada corregida',d=>byId(d.loan.paid,id).appliedMonth=ym)}
function projection(){let b=db.loan.balance,q=db.loan.monthly,i=db.loan.annualRate/1200,rows=[];if(b<=0||q<=0)return rows;for(let n=1;n<=600&&b>.005;n++){let interest=round(b*i);if(q<=interest)throw Error('La cuota no cubre los intereses.');let amount=round(Math.min(q,b+interest)),capital=round(amount-interest);b=round(Math.max(0,b-capital));rows.push({n,amount,interest,capital,balance:b})}if(b>.005)throw Error('La proyección supera 600 cuotas.');return rows}
function loanSchedule(){attempt(()=>{let rs=projection();if(!rs.length)throw Error('Configura saldo y cuota.');openModal('Proyección estimada',`<p>${rs.length} cuotas · sin seguros ni cargos.</p>`+table(['Cuota','Pago','Intereses','Capital','Saldo'],rs.map(x=>`<tr><td>${x.n}</td><td>${money(x.amount)}</td><td>${money(x.interest)}</td><td>${money(x.capital)}</td><td>${money(x.balance)}</td></tr>`))+btn('Cerrar','closeModal()'))})}
/* Anulación sin borrar historial */
function voidCount(xs){return xs.filter(x=>x.voided||x.deleted).length}
function voidBtn(key,label,rows){let n=voidCount(rows);return btn((showVoided[key]?'Ocultar':'Ver')+' '+label+(n?' ('+n+')':''),`toggleVoided('${key}')`)}
function toggleVoided(key){showVoided[key]=!showVoided[key];render()}
function deleteRecord(kind,id){attempt(()=>{const rows=kind==='documents'?db.documents:db[kind],x=byId(rows,id);if(!x||x.deleted)return;if(kind==='maintenance'&&x.cost>0&&db.expenses.some(e=>e.maintenanceId===id)){if(!confirm('Este servicio tiene un gasto vinculado en Gastos. El gasto se conserva (desvinculado) para que puedas anularlo aparte si corresponde. ¿Eliminar el servicio?'))return}else if(!confirm('Eliminar este registro: dejará de aparecer en listas, avisos y totales. Quedará marcado como eliminado, visible solo con «Ver anuladas/eliminadas» hasta que lo restaures o purgues. ¿Eliminar?'))return;commit('Registro eliminado · '+kind,d=>{let r=byId(kind==='documents'?d.documents:d[kind],id);r.deleted=true;r.deletedAt=new Date().toISOString();if(kind==='maintenance')for(const e of d.expenses)if(e.maintenanceId===id)e.maintenanceId=''})})}
function restoreRecord(kind,id){attempt(()=>{const rows=kind==='documents'?db.documents:db[kind],x=byId(rows,id);if(!x||!x.deleted)return;commit('Registro restaurado · '+kind,d=>{let r=byId(kind==='documents'?d.documents:d[kind],id);r.deleted=false;delete r.deletedAt})})}
function purgeDeleted(){attempt(()=>{let n=0;for(const k of ['plans','documents','maintenance'])n+=db[k].filter(x=>x.deleted).length;if(!n)return alert('No hay registros eliminados que purgar.');if(!confirm('Se borrarán definitivamente '+n+' registro(s) eliminado(s): alertas planificadas, documentos y/o servicios. Esta acción no se puede deshacer. ¿Continuar?'))return;commit('Purga definitiva · '+n+' registro(s)',d=>{for(const k of ['plans','documents','maintenance'])d[k]=d[k].filter(x=>!x.deleted)})})}

function vehicleStats(v){let ps=live(db.payments).filter(x=>x.vehicleId===v.id),es=live(db.expenses).filter(x=>x.vehicleId===v.id),income=sum(ps),op=sum(es.filter(x=>x.type==='Operativo')),cap=sum(es.filter(x=>x.type==='Capital')),loan=round(sum(live(db.loan.paid),p=>loanDistributionFor(p).filter(a=>a.vehicleId===v.id).reduce((t,a)=>t+a.amount,0))),profit=round(income-op),invested=round(+v.purchasePrice+cap),pct=invested>0?profit/invested*100:null,first=ps.map(x=>x.date).sort()[0],months=first?Math.max(1,diff(today(),first)/30.44):0,avg=months?profit/months:0,recover=invested>0&&profit>=invested?0:invested>0&&avg>0?Math.ceil((invested-profit)/avg):null;let ms=live(db.maintenance).filter(m=>m.vehicleId===v.id).sort((a,b)=>a.date.localeCompare(b.date)),perKm=null;if(ms.length){let m=ms[0],km=+v.mileage-m.mileage;if(km>0)perKm=sum(es.filter(e=>e.type==='Operativo'&&e.date>=m.date))/km}let idle=0;for(let i=0;i<30;i++){let dt=datePlus(today(),-i);if(v.purchaseDate&&dt<v.purchaseDate)continue;if(!db.assignments.some(a=>a.vehicleId===v.id&&a.startDate<=dt&&(!a.endDate||a.endDate>=dt)))idle++}let a=db.agreements.filter(a=>!a.cancelled&&a.vehicleId===v.id&&a.effectiveDate<=today()&&(!a.endDate||a.endDate>=today())).sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate))[0],rate=a?a.amount/(a.frequency==='Semanal'?7:a.frequency==='Quincenal'?15:30):null;return{income,op,cap,loan,profit,invested,pct,recover,perKm,idle,lost:rate==null?null:round(idle*rate),flow:round(income-op-cap-loan)}}

/* Centro de integridad: diagnóstico de solo lectura */
function integrityScan(data=db){let issues=[],counts={};const lists=['vehicles','drivers','assignments','agreements','periods','payments','expenses','maintenance','documents','plans','audit'];for(const k of lists){let a=data?.[k];counts[k]=Array.isArray(a)?a.length:0;if(!Array.isArray(a)){issues.push({level:'error',text:'La sección '+k+' no es una lista válida.'});continue}let ids=new Set();for(const r of a){if(!r||typeof r!=='object'){issues.push({level:'error',text:'Registro inválido en '+k+'.'});continue}if(!r.id||typeof r.id!=='string')issues.push({level:'error',text:'Registro sin ID en '+k+'.'});else if(ids.has(r.id))issues.push({level:'error',text:'ID duplicado en '+k+': '+r.id});else ids.add(r.id)}}
 const refs=[['assignments','vehicleId','vehicles','vehículo'],['assignments','driverId','drivers','chofer'],['agreements','vehicleId','vehicles','vehículo'],['agreements','driverId','drivers','chofer'],['periods','agreementId','agreements','acuerdo'],['payments','periodId','periods','vencimiento'],['payments','driverId','drivers','chofer'],['payments','vehicleId','vehicles','vehículo'],['expenses','vehicleId','vehicles','vehículo'],['maintenance','vehicleId','vehicles','vehículo'],['documents','vehicleId','vehicles','vehículo'],['plans','vehicleId','vehicles','vehículo'],['plans','driverId','drivers','chofer']];for(const [src,field,dst,label] of refs){if(!Array.isArray(data?.[src])||!Array.isArray(data?.[dst]))continue;let ids=new Set(data[dst].map(x=>x?.id));for(const r of data[src])if(r?.[field]&&!ids.has(r[field]))issues.push({level:'warning',text:`${src}: ${label} relacionado no encontrado (${r[field]}).`})}
 for(const [k,a] of Object.entries(data||{})){if(!Array.isArray(a))continue;for(const r of a){for(const f of DATE_FIELDS)if(r?.[f]&&!(k==='audit'&&f==='date')&&!validDate(r[f]))issues.push({level:'error',text:`Fecha no válida en ${k}.${f} (ID ${r.id||'sin ID'}).`});for(const f of NUM_FIELDS)if(r?.[f]!=null&&(!Number.isFinite(+r[f])||+r[f]<0))issues.push({level:'error',text:`Número no válido en ${k}.${f} (ID ${r.id||'sin ID'}).`})}}
 if(data?.loan&&!Array.isArray(data.loan.paid))issues.push({level:'error',text:'El historial de pagos del préstamo no es válido.'});return{issues,counts,errors:issues.filter(x=>x.level==='error').length,warnings:issues.filter(x=>x.level==='warning').length}}
/* La revisión de integridad se ejecuta sola al abrir y al guardar; los resultados se muestran en Ajustes y en el Resumen. */
function validateBackupPicker(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files?.[0];if(!file)return;if(file.size>25*1024*1024)return alert('Archivo demasiado grande: máximo 25 MB.');let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result),raw=parsed.data||parsed,candidate=normalize(structuredClone(raw)),r=integrityScan(candidate),total=Object.values(r.counts).reduce((a,b)=>a+b,0);openModal('Resultado de validación del respaldo',`<p><b>${esc(file.name)}</b></p><p>${total} registros · ${r.errors} errores · ${r.warnings} advertencias.</p>${r.errors?'<div class="notice">El archivo pasó por una validación con errores. No lo restaures sin investigar.</div>':'<p>'+badge('Estructura compatible','green')+' El archivo pudo leerse y superar las validaciones estructurales básicas.</p>'}${table(['Tipo','Detalle'],r.issues.slice(0,100).map(x=>`<tr><td>${badge(x.level==='error'?'Error':'Revisar',x.level==='error'?'red':'amber')}</td><td>${esc(x.text)}</td></tr>`))}<p class="muted">La validación no restaura el archivo ni modifica tus datos actuales.</p><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cerrar</button></div>`)}catch(e){alert('El archivo no superó la validación: '+e.message)}};reader.onerror=()=>alert('No se pudo leer el archivo.');reader.readAsText(file)};input.click()}
/* Ajustes, respaldo y recuperación */
function settingsView(){let age=db.lastBackup?Math.floor((Date.now()-new Date(db.lastBackup))/86400000):null;return `<div class="card"><h2>💾 Respaldo completo</h2><p class="muted">${age==null?'No hay respaldo registrado.':'Última descarga solicitada hace '+age+' días.'} Confirma que el archivo quedó guardado.</p><div class="actions">${btn('Crear respaldo','backup()','')}${btn('Restaurar respaldo','restorePicker()')}${btn('Descargar copia de seguridad local','downloadSafety()')}</div><p class="muted">El respaldo contiene cédulas y datos financieros. Consérvalo en un lugar privado.</p></div><div class="card"><h2>🔔 Avisos internos</h2><p>Cobros y préstamo: 7 días. Documentos y mantenimiento: aviso desde 30 días antes o a 500 km del kilometraje programado. Alertas planificadas: según los días de anticipación que definas en cada una. Para aceite y filtros se conserva la advertencia de intervalo mínimo recomendado de 45 días. Horario: Santo Domingo.</p><p>Todos los avisos se concentran en el menú Planificación. Al abrir se muestra un aviso general; el correo automático y las notificaciones del iPhone se configurarán más adelante.</p><p class="muted">Atajos de teclado (laptop): Alt+1…9 cambia de página, N abre el registro nuevo de la vista, Ctrl/⌘+Enter guarda el formulario abierto y Esc cierra.</p>${btn('Revisar avisos','showAlerts(true)')}<p class="muted">Sin login, PIN, envío de datos ni servicios externos.</p></div><div class="card"><h2>🛡️ Revisión automática de datos</h2><p>Estructura, IDs duplicados y relaciones entre registros se revisan solos al abrir la aplicación y después de cada guardado: ya no requieren un menú aparte.</p>${integrityStatus&&integrityStatus.errors?'<div class="notice">Se detectaron '+integrityStatus.errors+' error(es) y '+integrityStatus.warnings+' advertencia(s). Revisa los registros señalados antes de continuar.</div>'+table(['Tipo','Detalle'],integrityStatus.issues.filter(x=>x.level==='error').slice(0,20).map(x=>`<tr><td>${badge('Error','red')}</td><td>${esc(x.text)}</td></tr>`)):integrityStatus?'<p>'+badge(integrityStatus.warnings?'Sin errores estructurales':'Sin incidencias detectadas','green')+' Última revisión: '+integrityStatus.errors+' errores · '+integrityStatus.warnings+' advertencias.</p>'+(integrityStatus.warnings?'<div class="auditbox">'+integrityStatus.issues.filter(x=>x.level==='warning').slice(0,20).map(x=>`<p class="muted">⚠️ ${esc(x.text)}</p>`).join('')+'</div>':''):'<p class="muted">La revisión se ejecutará al abrir o al guardar.</p>'}${btn('Validar respaldo','validateBackupPicker()')}</div><div class="card"><h2>🕒 Actividad reciente</h2><div class="auditbox">${db.audit.slice(0,60).map(a=>`<p class="muted">${esc(new Date(a.date).toLocaleString('es-DO',{timeZone:'America/Santo_Domingo'}))} · ${esc(a.action)}</p>`).join('')||'<p class="muted">Sin actividad.</p>'}</div><p class="muted">Primero lo más reciente; desplázate dentro del recuadro para ver los movimientos anteriores.</p></div><div class="card"><h2>🗃️ Datos locales</h2><p>${db.vehicles.length} vehículos · ${db.drivers.length} choferes · ${live(db.payments).length} pagos vigentes.</p>${(()=>{let n=db.plans.filter(x=>x.deleted).length+db.documents.filter(x=>x.deleted).length+db.maintenance.filter(x=>x.deleted).length;return n?`<div class="actions">${btn('Purgar eliminados ('+n+')','purgeDeleted()','danger')}</div><p class="muted">Borrado definitivo de los registros eliminados (alertas, documentos y servicios). Tu último respaldo descargado conserva una copia.</p>`:''})()}<p class="notice">Los datos pertenecen a este navegador. Otro dispositivo no se sincroniza automáticamente. Usa respaldo y restauración para trasladarlos.</p>${btn('Borrar datos','clearAll()','danger')}</div>`}
function backup(){let d=structuredClone(db);d.lastBackup=new Date().toISOString();download(JSON.stringify({app:'JGD Fleet Manager',version:VERSION,exportedAt:d.lastBackup,data:d},null,2),`JGD-Fleet-Manager-V${VERSION}-respaldo-${today()}.json`,'application/json');commit('Descarga de respaldo solicitada',next=>next.lastBackup=d.lastBackup,false)}
function downloadSafety(){attempt(()=>{let raw=localStorage.getItem(SAFETY);if(!raw)throw Error('No existe copia de seguridad local en este navegador. Se guarda automáticamente antes de una restauración o borrado.');download(raw,'JGD-copia-de-seguridad-local.json','application/json')})}
function restorePicker(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files[0];if(!file)return;if(file.size>25*1024*1024)return alert('Archivo demasiado grande: máximo 25 MB.');let reader=new FileReader();reader.onload=()=>attempt(()=>{let x=JSON.parse(reader.result),candidate=normalize(structuredClone(x.data||x)),check=integrityScan(candidate);if(check.errors&&!confirm(`El respaldo contiene ${check.errors} errores estructurales y ${check.warnings} advertencias. La restauración podría introducir datos inconsistentes. ¿Deseas continuar bajo tu responsabilidad?`))return;if(!confirm(`Respaldo leído: ${candidate.vehicles.length} vehículos, ${candidate.drivers.length} choferes, ${check.errors} errores y ${check.warnings} advertencias. Restaurar reemplazará los datos actuales. ¿Continuar?`))return;let prior=localStorage.getItem(KEY)||'';if(prior)localStorage.setItem(SAFETY,prior);candidate.schemaVersion=6;audit(candidate,'Respaldo restaurado');generateInto(candidate);let s=JSON.stringify(candidate);localStorage.setItem(KEY,s);db=candidate;revision=s;fatal='';integrityStatus=integrityScan();$('recovery').hidden=true;closeModal();render();alert('Respaldo restaurado.');});reader.onerror=()=>alert('No se pudo leer el archivo.');reader.readAsText(file)};input.click()}
function clearAll(){if(!confirm('¿Borrar todos los datos de trabajo? Crea primero un respaldo.')||!confirm('Última confirmación: ¿continuar?'))return;attempt(()=>{let original=localStorage.getItem(KEY)||'';if(original!==revision)throw Error('Datos modificados en otra pestaña. Recarga primero.');if(original)localStorage.setItem(SAFETY,original);let next=blank(),s=JSON.stringify(next);localStorage.setItem(KEY,s);db=next;revision=s;integrityStatus=integrityScan();closeModal();render()})}
